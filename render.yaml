services:
  - type: web
    name: ai-design-to-wordpress-api
    runtime: node
    plan: free
    buildCommand: npm install && PLAYWRIGHT_BROWSERS_PATH=.cache/ms-playwright npx playwright install chromium
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: .cache/ms-playwright
